services:
  - type: web
    name: equiptra-api
    runtime: go
    rootDir: backend
    buildCommand: go build -o bin/api ./cmd/api
    startCommand: ./bin/api
    healthCheckPath: /healthz
    envVars:
      # Set for real once the pieces are ready — Render will prompt for any
      # var below without a value when you create the service from this blueprint.
      - key: DATABASE_URL
        sync: false # Supabase Postgres connection string
      - key: JWT_SECRET
        sync: false
      - key: FRONTEND_ORIGIN
        value: https://equiptra-smoky.vercel.app
      - key: COOKIE_SECURE
        value: "true"
      # Product photo uploads — Supabase Storage's native REST API (bearer
      # token, no request signing), replacing an earlier S3-compatible-client
      # attempt that failed with SignatureDoesNotMatch. See
      # docs/equiptra-photo-upload-addendum.md.
      - key: SUPABASE_PROJECT_REF
        sync: false # the subdomain of https://{ref}.supabase.co
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false # server-side only — never sent to the frontend, never logged
      # Self-service "Forgot password" — same SendGrid account/authenticated
      # domain as the Ralto/Crewing repo (backend/render.yaml there); reuses
      # no-reply@simplifiedsuite.io rather than repeating that domain's own
      # sender-verification setup for a new subdomain.
      - key: SENDGRID_API_KEY
        sync: false
      - key: SENDGRID_FROM_EMAIL
        value: no-reply@simplifiedsuite.io
      - key: SENDGRID_FROM_NAME
        value: Equiptra
